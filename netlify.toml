# ==============================================================================
# Netlify Deployment Configuration for Valence OTC Crypto Platform
# ==============================================================================

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API Route Rewrites to Netlify Serverless Functions (Backed by Cloudflare D1 SQL)
[[redirects]]
  from = "/api/auth-login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/admin-pricing"
  to = "/.netlify/functions/admin-pricing"
  status = 200

[[redirects]]
  from = "/api/admin-history"
  to = "/.netlify/functions/admin-history"
  status = 200

# Catch-all API fallback to functions if needed
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single Page Application (SPA) routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Recommended HTTP Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
